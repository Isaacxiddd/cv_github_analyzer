<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV ↔ GitHub Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 420px;
      min-height: 200px;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 1em; font-weight: 600 }
    .header span { font-size: 0.75em; color: #94a3b8 }
    .body { padding: 16px; display: flex; flex-direction: column; gap: 12px }

    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #6366f1; background: #eef2ff }
    .drop-zone.has-file { border-color: #22c55e; background: #f0fdf4 }
    .drop-zone-icon { font-size: 1.8em; margin-bottom: 6px }
    .drop-zone-text { font-size: 0.85em; color: #64748b }
    .drop-zone-name { font-size: 0.85em; color: #16a34a; font-weight: 600; margin-top: 4px }

    label { font-size: 0.82em; font-weight: 600; color: #374151 }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.9em;
      background: #fff;
      margin-top: 4px;
    }
    input[type="text"]:focus { outline: none; border-color: #6366f1 }

    button#analyze-btn {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#analyze-btn:hover { background: #4338ca }
    button#analyze-btn:disabled { background: #94a3b8; cursor: not-allowed }

    #status {
      font-size: 0.8em;
      color: #64748b;
      text-align: center;
      min-height: 18px;
    }
    #status.error { color: #dc2626 }

    #results {
      max-height: 480px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
    #results:empty { display: none }

    input[type="file"] { display: none }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>CV ↔ GitHub Analyzer</h1>
      <span>Detect skill inconsistencies</span>
    </div>
  </div>

  <div class="body">
    <!-- PDF Drop Zone -->
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">📄</div>
      <div class="drop-zone-text">Drop your CV (PDF) here or click to select</div>
      <div class="drop-zone-name" id="file-name"></div>
    </div>
    <input type="file" id="file-input" accept=".pdf" />

    <!-- GitHub username -->
    <div>
      <label for="username-input">GitHub username</label>
      <input type="text" id="username-input" placeholder="e.g. torvalds" autocomplete="off" />
    </div>

    <button id="analyze-btn" disabled>Analyze</button>
    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
