<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV ↔ GitHub Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 480px;
      min-height: 200px;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 0.95em; font-weight: 600; flex: 1 }
    .header .sub { font-size: 0.72em; color: #94a3b8 }
    .btn-header {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.75em;
      transition: all 0.15s;
    }
    .btn-header:hover { background: #1e293b; color: #f8fafc }
    .body { padding: 12px; display: flex; flex-direction: column; gap: 10px }

    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #6366f1; background: #eef2ff }
    .drop-zone.has-file { border-color: #22c55e; background: #f0fdf4 }
    .drop-zone-icon { font-size: 1.5em; margin-bottom: 4px }
    .drop-zone-text { font-size: 0.8em; color: #64748b }
    .drop-zone-name { font-size: 0.8em; color: #16a34a; font-weight: 600; margin-top: 4px }

    label { font-size: 0.78em; font-weight: 600; color: #374151 }
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85em;
      background: #fff;
      margin-top: 3px;
    }
    input[type="text"]:focus { outline: none; border-color: #6366f1 }

    .row { display: flex; gap: 8px; align-items: end }
    .row input { flex: 1 }
    button#analyze-btn {
      padding: 7px 16px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.82em;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button#analyze-btn:hover { background: #4338ca }
    button#analyze-btn:disabled { background: #94a3b8; cursor: not-allowed }

    #status {
      font-size: 0.78em;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }
    #status.error { color: #dc2626 }

    .token-section {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 7px 10px;
    }
    .token-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .token-header .label { font-size: 0.76em; font-weight: 600; color: #374151 }
    .token-header .status { font-size: 0.72em; color: #64748b }
    .token-header .status.ok { color: #16a34a }
    .token-header .arrow { font-size: 0.65em; color: #94a3b8; transition: transform 0.2s }
    .token-header .arrow.open { transform: rotate(90deg) }
    .token-body { display: none; margin-top: 6px; gap: 5px }
    .token-body.open { display: flex; flex-direction: column }
    .token-input-row { display: flex; gap: 5px }
    .token-input-row input {
      flex: 1; padding: 5px 8px; border: 1px solid #e2e8f0;
      border-radius: 5px; font-size: 0.74em; font-family: monospace; background: #fff;
    }
    .token-input-row input:focus { outline: none; border-color: #6366f1 }
    .token-input-row .btn-icon {
      padding: 5px 8px; border: 1px solid #e2e8f0; border-radius: 5px;
      background: #fff; cursor: pointer; font-size: 0.76em; color: #64748b;
    }
    .token-input-row .btn-icon:hover { background: #f1f5f9 }
    .token-hint { font-size: 0.68em; color: #94a3b8; line-height: 1.4 }
    .token-hint a { color: #6366f1 }
    .token-clear {
      background: none; border: none; font-size: 0.68em; color: #dc2626;
      cursor: pointer; padding: 0; text-align: left;
    }
    .token-clear:hover { text-decoration: underline }

    /* ── History Panel ── */
    .history-panel {
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
      margin-top: 4px;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .history-header .title { font-size: 0.78em; font-weight: 600; color: #374151 }
    .history-header .clear-btn {
      background: none; border: none; font-size: 0.68em; color: #94a3b8;
      cursor: pointer; padding: 0;
    }
    .history-header .clear-btn:hover { color: #dc2626 }
    .history-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 5px;
      background: #fff;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover { background: #f8fafc }
    .history-item .h-user { font-size: 0.78em; font-weight: 600; flex: 1 }
    .history-item .h-score { font-size: 0.72em; font-weight: 600; color: #16a34a }
    .history-item .h-date { font-size: 0.65em; color: #94a3b8 }
    .history-empty { font-size: 0.74em; color: #94a3b8; text-align: center; padding: 12px 0 }

    #results {
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }
    #results:empty { display: none }
    input[type="file"] { display: none }
    .footer { text-align: center; padding: 8px 0 2px; font-size: 0.68em; color: #94a3b8; border-top: 1px solid #e2e8f0; margin-top: 4px }
    .footer a { color: #6366f1; text-decoration: none }
    .footer a:hover { text-decoration: underline }

    .divider { display:flex;align-items:center;gap:8px;font-size:0.7em;color:#94a3b8 }
    .divider::before,.divider::after { content:"";flex:1;height:1px;background:#e2e8f0 }
    .url-row { display:flex;gap:6px;margin-top:3px }
    .url-row input { flex:1;padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:0.85em;background:#fff }
    .url-row input:focus { outline:none;border-color:#6366f1 }
    #btn-scrape { padding:7px 12px;background:#0f172a;color:white;border:none;border-radius:6px;font-size:0.78em;font-weight:600;cursor:pointer;white-space:nowrap }
    #btn-scrape:hover { background:#1e293b }
    #btn-scrape:disabled { background:#94a3b8;cursor:not-allowed }
    .portfolio-section { display:flex;flex-direction:column;gap:3px }
    .portfolio-pill { display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f1f5f9;border-radius:6px;font-size:0.78em;margin-top:4px }
    .badge { padding:2px 7px;border-radius:10px;font-weight:600;font-size:0.72em }
    .level-junior { background:#e8f5e9;color:#2e7d32 }
    .level-mid { background:#fff8e1;color:#f57f17 }
    .level-senior { background:#e3f2fd;color:#1565c0 }
    .level-unknown { background:#f1f5f9;color:#64748b }
    .pill-skills { margin-left:auto;color:#64748b;font-size:0.75em }
    .pill-clear { background:none;border:none;cursor:pointer;color:#94a3b8;padding:0 2px;font-size:0.85em }
    .pill-clear:hover { color:#dc2626 }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/logo_32.png" width="32" height="32" alt="Logo" style="flex-shrink:0" />
    <div>
      <h1>CV ↔ GitHub Analyzer</h1>
      <span class="sub">Detect skill inconsistencies</span>
    </div>
    <button class="btn-header" id="minimize-btn">—</button>
  </div>

  <div class="body">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">📄</div>
      <div class="drop-zone-text">Drop your CV (PDF) here or click to select</div>
      <div class="drop-zone-name" id="file-name"></div>
    </div>
    <input type="file" id="file-input" accept=".pdf" />

    <div class="row">
      <div style="flex:1">
        <label for="username-input">GitHub username</label>
        <input type="text" id="username-input" placeholder="e.g. torvalds" autocomplete="off" />
      </div>
      <button id="analyze-btn" disabled>Analyze</button>
    </div>

    <div class="divider"><span>or scrape a portfolio</span></div>

    <div class="portfolio-section">
      <label for="portfolio-url">Portfolio URL</label>
      <div class="url-row">
        <input type="url" id="portfolio-url" placeholder="https://myportfolio.dev" autocomplete="off" />
        <button id="btn-scrape" disabled>Scrape</button>
      </div>
      <div class="portfolio-pill" id="portfolio-pill" hidden>
        <span id="pill-name">—</span>
        <span class="badge" id="pill-seniority">—</span>
        <span class="pill-skills" id="pill-skills">0 skills</span>
        <button class="pill-clear" id="pill-clear">✕</button>
      </div>
    </div>

    <div class="token-section" id="token-section">
      <div class="token-header" id="token-toggle">
        <span class="label">🔑 GitHub Token</span>
        <span class="status" id="token-status">Not set</span>
        <span class="arrow" id="token-arrow">▶</span>
      </div>
      <div class="token-body" id="token-body">
        <div class="token-input-row">
          <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" spellcheck="false" autocomplete="off" />
          <button class="btn-icon" id="token-toggle-vis" title="Toggle visibility">👁</button>
        </div>
        <p class="token-hint">
          Paste a <a href="https://github.com/settings/tokens" target="_blank">GitHub PAT</a>
          to raise the API rate limit to 5 000 req/h.
        </p>
        <button class="token-clear" id="token-clear">Remove token</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="results"></div>

    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <span class="title">📋 Analysis History</span>
        <button class="clear-btn" id="clear-history">Clear history</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <div class="footer">Made by <a href="https://github.com/Isaacxiddd" target="_blank">Isaac Garcia</a></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
